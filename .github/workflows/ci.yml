name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Actions 탭에서 main 을 골라 수동 배포
  workflow_dispatch:

permissions: { contents: read }

jobs:
  python:
    runs-on: ubuntu-latest
    # DB 테스트용. 접속 정보는 app/config.py 기본값과 같다
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kaltoe
          POSTGRES_PASSWORD: kaltoe
          POSTGRES_DB: kaltoe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaltoe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kaltoe-backend:ci
      - name: 컨테이너 기동 후 /health 확인
        run: |
          docker run -d --name api -p 8000:8000 kaltoe-backend:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  # main 에 병합된 변경이 서버 이미지에 영향을 주는지 확인한다 (문서만 바뀌면 재시작하지 않음)
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD \
            | grep -qE '^(app/|Dockerfile$|\.dockerignore$|pyproject\.toml$|uv\.lock$|\.python-version$|\.github/workflows/ci\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # 서버 코드가 바뀐 채로 main 에 병합되거나 수동 실행하면 이미지를 GHCR 에 올리고 EC2 에 배포한다 (PR 에서는 건너뜀)
  deploy:
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.python.result == 'success' && needs.docker.result == 'success'
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true')
    needs: [python, docker, changes]
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kaltoe/backend:latest
            ghcr.io/kaltoe/backend:${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      # 회의룸 상태가 메모리에 있어 재시작 시 진행 중인 회의가 끊긴다
      - name: 서버에 배포
        run: |
          id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["cd /opt/kaltoe && docker compose pull api && docker compose up -d api && docker image prune -f"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || {
            aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
            exit 1
          }
      - name: 배포 확인
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://api.wacaw.shop/health
